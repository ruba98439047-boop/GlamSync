<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlamSync - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff0f5, #f8c8dc);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #d63384;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #d63384;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b8236b;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .links {
            text-align: center;
            margin-top: 18px;
        }

        a {
            color: #d63384;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>GlamSync</h1>
        <p class="subtitle">Welcome Back! Login to Your Account</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>

        <div class="links">
            <p>
                <a href="ForgotPassword.html">Forgot Password?</a>
            </p>

            <p style="margin-top: 12px;">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>
        </div>

    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const savedData = localStorage.getItem("glamsyncUser");
            const message = document.getElementById("message");

            if (!savedData) {
                message.style.color = "red";
                message.innerText = "Please register first!";
                return;
            }

            const savedUser = JSON.parse(savedData);

            if (
                savedUser.email === email &&
                savedUser.password === password
            ) {

                message.style.color = "
